name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lane1_test
          POSTGRES_USER: lane1_app
          POSTGRES_PASSWORD: lane1_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lane1_app -d lane1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lane1_app:lane1_test_password@localhost:5432/lane1_test
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v7
        with:
          # Voller Verlauf statt des Standard-Shallow-Checkouts (Tiefe 1) —
          # der Befund-U5-Schritt unten vergleicht per `git diff` gegen die
          # Basis dieses Pushes/PRs und bräuchte deren Commit sonst nicht
          # verfügbar.
          fetch-depth: 0

      - name: apps/web-Änderungen erfordern eine CACHE_VERSION-Anhebung (Befund U5)
        # Review 30.08.2026, Befund U5: sw.js' CACHE_VERSION entscheidet,
        # ob eine bereits offene Sitzung ein Update überhaupt bemerkt
        # (siehe dortiger Kommentar in apps/web/sw.js) — bislang erzwang
        # nichts, dass sie bei einer Änderung unterhalb apps/web/ auch
        # tatsächlich mit angehoben wird. Vergleicht die geänderten
        # Dateien dieses Pushes/PRs gegen dessen Basis: taucht dabei eine
        # AUSGELIEFERTE Datei unterhalb apps/web/ auf, muss die
        # CACHE_VERSION-Zeile selbst ebenfalls im Diff von sw.js stehen.
        #
        # Selbst-Review 31.08.2026: die erste Fassung prüfte pauschal
        # `-- apps/web` und verlangte damit auch für eine reine
        # Test-Änderung (apps/web/test/, vitest.config.js, package.json,
        # eslint.config.cjs — nichts davon steht in PRECACHE_URLS, nichts
        # davon erreicht je einen Browser) eine CACHE_VERSION-Anhebung.
        # Das ist nicht bloß lästig: jede Anhebung verwirft den kompletten
        # Cache ALLER Clients und erzwingt einen erneuten Download aller
        # 58 precachten Dateien — ein hoher Preis für eine geänderte
        # Testdatei, und ein wirksamer Anreiz, die Prüfung zu umgehen.
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "Keine nutzbare Basis-Referenz (z. B. erster Commit auf dem Branch) — Prüfung übersprungen."
            exit 0
          fi
          CHANGED_WEB_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- apps/web \
            ':(exclude)apps/web/test' \
            ':(exclude)apps/web/vitest.config.js' \
            ':(exclude)apps/web/eslint.config.cjs' \
            ':(exclude)apps/web/package.json' \
            ':(exclude)apps/web/README.md')
          if [ -z "$CHANGED_WEB_FILES" ]; then
            echo "Keine Änderungen an ausgelieferten Dateien unterhalb apps/web/ — nichts zu prüfen."
            exit 0
          fi
          echo "Geänderte ausgelieferte Dateien unterhalb apps/web/:"
          echo "$CHANGED_WEB_FILES"
          if ! git diff "$BASE_SHA" HEAD -- apps/web/sw.js | grep -q '^[+-]const CACHE_VERSION'; then
            echo "::error::apps/web/ wurde geändert, aber CACHE_VERSION in apps/web/sw.js nicht angehoben (siehe docs/review-sicherheit-effizienz-usability-2026-08-30.md, Befund U5)."
            exit 1
          fi
          echo "CACHE_VERSION wurde angehoben."

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (alle Workspaces)
        run: npm ci

      - name: Abhängigkeits-Audit (npm audit)
        # Ergänzt nach dem Sicherheitsreview in Abschnitt 15/12 des
        # Backend-Entwicklungsplans — der Fund der nodemailer-CVEs (mehrere
        # High-Severity-Advisories) erfolgte dort durch einen manuell
        # angestoßenen Lauf, nicht durch eine automatisierte Prüfung.
        # Dieser Schritt schließt genau diese Lücke: künftige CVEs in
        # Produktionsabhängigkeiten lassen den PR-Check fehlschlagen, statt
        # unbemerkt bis zum nächsten manuellen Review liegen zu bleiben.
        #
        # --omit=dev: nur Produktionsabhängigkeiten zählen für das
        # Blockieren des Merges — eine Schwachstelle in einem reinen
        # Build-/Test-Tool (z. B. vitest/esbuild, siehe Abschnitt 12) hat
        # keine Auswirkung auf die ausgelieferte Anwendung und soll den
        # Merge nicht verhindern; sie bleibt trotzdem sichtbar (zweiter
        # Schritt unten, informativ statt blockierend).
        #
        # --audit-level=high (bewusst NICHT "critical"): Der real
        # gefundene nodemailer-Fund war als "high" eingestuft, nicht
        # "critical" — ein Schwellenwert von "critical" hätte genau diesen
        # Fund nicht automatisch erkannt und den ursprünglichen Zweck
        # dieses Schritts unterlaufen. "high" ist der niedrigste
        # Schwellenwert, der diesen konkreten Fall abgedeckt hätte, ohne
        # bei jeder harmlosen "moderate"/"low"-Meldung den Merge zu
        # blockieren. Bei Bedarf hier anpassbar (z. B. auf "critical"
        # lockern oder auf "moderate" verschärfen).
        run: npm audit --omit=dev --audit-level=high

      - name: Abhängigkeits-Audit — Dev-Abhängigkeiten (informativ, blockiert NICHT)
        # Deckt z. B. die bekannte esbuild/vite-Dev-Server-Schwachstelle ab
        # (siehe Abschnitt 12) — betrifft nur `npm run dev`/lokale
        # Testläufe, nicht die Produktionslaufzeit. `continue-on-error`,
        # damit sie im Job-Log sichtbar bleibt, aber den Merge nicht
        # blockiert; sollte dennoch zeitnah manuell geprüft werden.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build gemeinsame Pakete (shared-types, sync-protocol)
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/sync-protocol

      - name: Prisma Client generieren
        # Direktes 'cd' statt --workspace=apps/api — unabhängig von npms
        # Pfad-/Namensauflösung für Workspaces, daher robuster gegen genau
        # diese Fehlerklasse ("No workspaces found").
        run: cd apps/api && npm run prisma:generate

      - name: Prisma-Migrationen in die Test-Datenbank anwenden
        # Der oben gestartete Postgres-Service-Container ist leer — ohne
        # diesen Schritt existieren die Anwendungstabellen dort nicht.
        # `migrate deploy` statt `db push` (Code-Review, Befund W5): wendet
        # exakt die committeten, reviewbaren Migrationsdateien aus
        # prisma/migrations/ an (dieselben, die auch das Produktions-
        # Deployment ausführt, siehe docs/deployment.md, Abschnitt 7.3) —
        # nicht-interaktiv, ohne Rückfrage bei potenziell datenverlierenden
        # Änderungen, und schlägt bei einer von der Historie abweichenden
        # schema.prisma fehl statt sie stillschweigend zu übernehmen. Damit
        # prüft dieser CI-Lauf zugleich, dass die Migrationshistorie
        # tatsächlich zum aktuellen Schema passt. Nötig für die Prisma-
        # Integrationstests unten (Code-Review, Befund 14) — der Service-
        # Container lief zuvor bereits mit, wurde aber nie tatsächlich mit
        # dem Anwendungsschema befüllt.
        run: cd apps/api && npx prisma migrate deploy

      - name: Typecheck apps/api (inkl. test/, test-integration/, scripts/, prisma/)
        # WICHTIG: "Build apps/api" (unten) prüft per tsconfig.json NUR
        # src/ — Typfehler in Testdateien blieben dadurch lange unentdeckt,
        # obwohl vitest (esbuild, ohne Typprüfung) grün lief. Dieser Schritt
        # schließt genau diese Lücke.
        run: cd apps/api && npm run typecheck

      - name: Lint (alle Workspaces)
        run: npm run lint --workspaces --if-present

      - name: Test (alle Workspaces)
        run: npm run test --workspaces --if-present

      - name: Prisma-Integrationstests (apps/api, gegen den echten Postgres-Service-Container)
        # Eigener Schritt statt Teil von "Test" oben (siehe Code-Review,
        # Befund 14 und vitest.integration.config.ts): die Suite oben läuft
        # bewusst nur gegen die *.repository.memory.ts-Doubles, ohne
        # Datenbank — diese hier prüft dieselbe Business-Logik zusätzlich
        # gegen die ECHTEN Prisma-Implementierungen (PrismaSyncGateway,
        # PrismaUserRepository, PrismaProfileDataGateway,
        # PrismaErasureJobGateway), wo das sicherheitskritische
        # Vereins-Scoping ("where: { id, clubId }") tatsächlich sitzt.
        run: cd apps/api && npm run test:integration

      - name: Build apps/api
        run: cd apps/api && npm run build
