# docker-compose.yml — lokale Entwicklungsumgebung (Phase 0).
# Start: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lane1
      POSTGRES_USER: lane1_app
      POSTGRES_PASSWORD: lane1_dev_password
    ports:
      # Nur auf localhost binden statt auf allen Interfaces — sonst ist
      # Postgres mit diesem hartcodierten Dev-Passwort für jeden im
      # gleichen Netz erreichbar und komplett unauthentifiziert
      # zugänglich, ohne dass die App/Login-Seite involviert ist.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lane1_app -d lane1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # Sicherheitsreview 2026-08-27, Befund N7: der Standardwert
      # (127.0.0.1, siehe config/env.ts) bindet nur den Loopback — INNERHALB
      # des Containers wäre das für den Host nicht erreichbar. 0.0.0.0 ist
      # hier tatsächlich richtig, da der Zugriff über Dockers eigene
      # Portweiterleitung läuft (siehe "ports" unten), nicht über einen im
      # selben Netzwerk-Namespace laufenden Reverse Proxy wie bei den
      # dokumentierten Deployments.
      HOST: "0.0.0.0"
      PORT: 3000
      DATABASE_URL: "postgresql://lane1_app:lane1_dev_password@postgres:5432/lane1"
      # Kein JWT_*-Schlüsselpaar gesetzt: config/env.ts kennt in
      # development/test ohnehin nur JWT_PRIVATE_KEY/JWT_PUBLIC_KEY (RS256,
      # PEM) — ein Wegwerf-Schlüsselpaar wird dann automatisch erzeugt
      # (siehe auth/keys.ts). Für Produktion siehe docs/deployment.md,
      # Abschnitt 7.2.
      CORS_ORIGIN: "http://localhost:5173"
      # Sicherheitsreview 2026-08-27, Befund H1: TRUSTED_PROXY_IPS bleibt
      # hier bewusst UNGESETZT (Standard: leer) — dieser lokale Aufbau hat
      # keinen vorgeschalteten Reverse Proxy, der Client verbindet sich
      # direkt mit dem veröffentlichten Port (siehe "ports" unten).
      # NODE_ENV bleibt "development", daher erzwingt env.ts hier keinen
      # gesetzten Wert (anders als in Produktion).
      # Basis-URL des Frontends — für den Einladungslink in der
      # Versand-E-Mail (siehe invitations.service.ts). Explizit statt dem
      # (zufällig identischen) Standardwert aus env.ts überlassen: dieser
      # Docker-Compose-Aufbau startet nur API + Postgres, das Frontend läuft
      # separat auf dem Host über `npm run dev:web` (Port 5173, siehe
      # CORS_ORIGIN oben).
      FRONTEND_BASE_URL: "http://localhost:5173"
      # SMTP_HOST bewusst nicht gesetzt: ohne eigenen lokalen Mailserver
      # greift ConsoleMailSender als Ausweichlösung (protokolliert die
      # Einladung statt sie zu versenden, siehe mailer.ts) — genau richtig
      # für diesen lokalen Entwicklungsaufbau.
    ports:
      - "3000:3000"

volumes:
  postgres_data:
